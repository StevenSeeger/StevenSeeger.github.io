[settings]
idiomatic_version_file_enable_tools = ["node"]

[tools]
node = "22"
npm = "10"
biome = "latest"

[tasks]
build = "npm run build"
test = "npm test"
dev = "npm run dev"

[tasks.write]
description = "Run the biome formatter, linter and assist action in single pass, applying all fixes (including unsafe)"
run = "biome check --write --unsafe"